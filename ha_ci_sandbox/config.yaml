name: HA CI Sandbox
version: "0.2.0"
slug: ha_ci_sandbox
description: Run a JVM application bundle in a network-isolated sandbox
url: https://github.com/kingpanther13/ha-ci-sandbox
arch:
  - amd64
startup: application
boot: manual
ports:
  8080/tcp: 8080
  8081/tcp: null
  8082/tcp: null
  8083/tcp: null
  8084/tcp: null
  8085/tcp: null
  8086/tcp: null
  8087/tcp: null
ports_description:
  8080/tcp: Instance 1 HTTP
  8081/tcp: Instance 2 HTTP (only when instances >= 2)
  8082/tcp: Instance 3 HTTP (only when instances >= 3)
  8083/tcp: Instance 4 HTTP (only when instances >= 4)
  8084/tcp: Instance 5 HTTP (only when instances >= 5)
  8085/tcp: Instance 6 HTTP (only when instances >= 6)
  8086/tcp: Instance 7 HTTP (only when instances >= 7)
  8087/tcp: Instance 8 HTTP (only when instances >= 8)
map:
  - type: share
    read_only: true
privileged:
  - SYS_ADMIN
  - NET_ADMIN
apparmor: true
options:
  instances: 1
  bundle_dir: /share/ha-ci-sandbox
  allowed_hosts:
    - raw.githubusercontent.com
    - github.com
    - api.github.com
    - objects.githubusercontent.com
    - codeload.github.com
  java_opts: "-Xms336m -Xmx336m -XX:MaxMetaspaceSize=208m -Xss224k"
  log_level: info
schema:
  instances: int(1,8)
  bundle_dir: str
  bundle_url: str?
  bundle_sha256: str?
  allowed_hosts:
    - str
  java_opts: str
  log_level: list(info|debug)
  notes: str?
